<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيد ميلاد سعيد يا شهد 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- خلفيات متحركة -->
  <canvas id="confetti"></canvas>
  <div id="balloons"></div>

  <!-- الشاشة 1: الهدية + الصورة -->
  <section id="giftScreen" class="screen active">
    <h2 class="hint" id="giftHint">في إلك مفاجأة يا شهد 👀</h2>
    <div class="gift" id="gift">
      <div class="photo-pop">
        <div class="ring"></div>
        <img src="shahd.jpg" alt="شهد">
      </div>
      <div class="gift-lid"><span class="bow"></span></div>
      <div class="gift-box"></div>
    </div>
    <p class="hint small" id="giftSub">اكبسي على الهدية 🎁</p>
  </section>

  <!-- الشاشة 2: الكيكة -->
  <section id="cakeScreen" class="screen">
    <h1 class="title">كل عام وأنتِ بخير</h1>
    <h2 class="name">شهد صالح</h2>
    <div class="age"><span id="ageNum">0</span> سنة 🎉</div>

    <div class="cake" id="cake">
      <div class="candles">
        <div class="candle"><span class="num">2</span><div class="flame"></div></div>
        <div class="candle"><span class="num">4</span><div class="flame"></div></div>
      </div>
      <div class="layer top"></div>
      <div class="layer middle"></div>
      <div class="layer bottom"></div>
      <div class="plate"></div>
    </div>

    <p class="hint small" id="cakeHint">اتمنّي أمنية واكبسي على الشموع عشان تطفيها 🕯️</p>
    <button class="btn hidden" id="toMessage">في رسالة إلك 💌</button>
  </section>

  <!-- الشاشة 3: الرسالة + صورة بولارويد -->
  <section id="messageScreen" class="screen">
    <div class="letter-wrap">
      <figure class="polaroid">
        <img src="shahd.jpg" alt="شهد">
        <figcaption>شهد 💖</figcaption>
      </figure>

      <div class="card">
        <h2>إلى خالتي شهد 💖</h2>
        <p id="typed"></p>
        <p class="sign hidden" id="sign">— ابن أختك علوش
             😎</p>
      </div>
    </div>
    <button class="btn hidden" id="replay">من الأول 🔁</button>
  </section>

  <!-- زر الموسيقى -->
  <button id="musicBtn" class="music-btn" title="الموسيقى">🎵</button>

  <!-- مشغّل يوتيوب -->
  <div id="ytWrap" class="yt-wrap"><div id="ytPlayer"></div></div>

  <script src="script.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
